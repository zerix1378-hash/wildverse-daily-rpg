<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>WILDVERSE DAILY RPG</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#080d18;color:#f4f7ff;font-family:system-ui,-apple-system,sans-serif}.wrap{max-width:760px;margin:auto;padding:18px}header{font-weight:900;letter-spacing:2px;font-size:24px;margin:10px 0 24px}.sub{color:#9ba9c7;font-size:13px;letter-spacing:3px}.panel{background:#111b2e;border:1px solid #263755;border-radius:18px;padding:20px;margin:14px 0}.muted{color:#9ba9c7}h1{font-size:27px;margin:12px 0}input{width:100%;padding:13px;margin:6px 0;border:1px solid #344666;border-radius:11px;background:#0b1425;color:white;font-size:16px}button{padding:12px 15px;border:0;border-radius:11px;background:#526dff;color:white;font-weight:800;font-size:15px;margin:5px 3px 5px 0}button.alt{background:#263755}.stats,.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat,.creature{background:#0b1425;padding:14px;border-radius:13px}.stat b{display:block;font-size:23px;color:#8ee6c2}.task{display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:1px solid #263755;padding:8px 0}.task button{min-width:92px}.cards{grid-template-columns:repeat(2,1fr)}.creature{text-align:center}.emoji{font-size:40px}.hidden{filter:brightness(0);text-shadow:0 0 1px #000}.small{font-size:12px;color:#9ba9c7}#game{display:none}.tabs{display:flex;gap:6px}.tabs button{flex:1}footer{text-align:center;color:#657493;font-size:12px;padding:25px}@media(min-width:600px){.stats{grid-template-columns:repeat(4,1fr)}.cards{grid-template-columns:repeat(3,1fr)}}
</style></head>
<body><main class="wrap">
<header>WILDVERSE <span class="sub">DAILY RPG</span></header>
<section id="auth" class="panel">
 <div class="sub">CREATURE COLLECTION RPG</div><h1>오늘의 하루가<br>모험이 된다.</h1>
 <p class="muted">Supabase 연결 정보를 입력한 뒤 회원가입 또는 로그인할 수 있어.</p>
 <input id="url" placeholder="Supabase Project URL (https://...supabase.co)">
 <input id="key" placeholder="Supabase anon public key">
 <input id="email" type="email" placeholder="이메일">
 <input id="password" type="password" placeholder="비밀번호 (6자 이상)">
 <button onclick="authAction('signup')">무료 회원가입</button><button class="alt" onclick="authAction('login')">로그인</button>
 <p id="msg" class="muted"></p>
</section>
<section id="game">
 <div class="panel"><div style="display:flex;justify-content:space-between;align-items:center"><div><span class="sub">PLAYER</span><h1 id="level">모험가 레벨 1</h1><div id="who" class="muted"></div></div><button class="alt" onclick="logout()">로그아웃</button></div>
 <div class="stats"><div class="stat">레벨<b id="slevel">1</b></div><div class="stat">경험치<b id="xp">0 XP</b></div><div class="stat">코인<b id="coins">0</b></div><div class="stat">도감<b id="count">0/10</b></div></div></div>
 <div class="tabs"><button onclick="showTab('tasks')">일일 퀘스트</button><button class="alt" onclick="showTab('book')">생명체 도감</button></div>
 <section id="tasks" class="panel"><h2>오늘의 퀘스트</h2><p class="muted">완료하면 경험치 20 XP와 코인 10개!</p><div id="tasklist"></div></section>
 <section id="book" class="panel" style="display:none"><h2>생명체 도감</h2><p class="muted">미발견 생명체는 검은 실루엣으로 표시돼.</p><div id="booklist" class="cards"></div><p id="detail" class="muted"></p></section>
</section><footer>WILDVERSE DAILY RPG</footer></main>
<script>
let sb=null,profile=null;
const tasks=['물 한 컵 마시기','책상 정리하기','공부 또는 독서 20분','가벼운 스트레칭','오늘 할 일 정리하기'];
const creatures=[['모스링','🌱','포유 계열'],['파도룡','🐬','해양 계열'],['루미나','✨','정령 계열'],['코스모','🪐','우주 계열'],['스톤벅','🪨','광물 계열'],['플레어','🦎','파충류 계열'],['윙키','🦅','조류 계열'],['버그렛','🪲','곤충 계열'],['고스트','👻','언데드 계열'],['티라노','🦖','공룡 계열']];
function say(t){document.getElementById('msg').textContent=t}
function client(){let u=document.getElementById('url').value.trim(),k=document.getElementById('key').value.trim();if(!u||!k)throw Error('Supabase URL과 anon public key를 먼저 입력해줘.');localStorage.setItem('wv_url',u);localStorage.setItem('wv_key',k);return window.supabase.createClient(u,k)}
async function authAction(mode){try{sb=client();let email=document.getElementById('email').value,password=document.getElementById('password').value;if(!email||password.length<6)throw Error('이메일과 6자 이상 비밀번호를 입력해줘.');let r=mode==='signup'?await sb.auth.signUp({email,password}):await sb.auth.signInWithPassword({email,password});if(r.error)throw r.error;if(mode==='signup'&&!r.data.session){say('가입 요청 완료! 이메일 인증을 마친 뒤 로그인해줘.');return}await enter()}catch(e){say(e.message)}}
async function enter(){let {data:{user},error}=await sb.auth.getUser();if(error||!user)throw Error('로그인 정보를 확인할 수 없어.');let r=await sb.from('profiles').select('*').eq('id',user.id).maybeSingle();if(r.error)throw r.error;if(!r.data){let ins=await sb.from('profiles').insert({id:user.id}).select().single();if(ins.error)throw ins.error;profile=ins.data}else profile=r.data;document.getElementById('auth').style.display='none';document.getElementById('game').style.display='block';document.getElementById('who').textContent=user.email;render()}
async function save(patch){let next={...profile,...patch};let r=await sb.from('profiles').update(patch).eq('id',profile.id);if(r.error){alert(r.error.message);return}profile=next;render()}
function render(){let xp=profile.xp||0,level=profile.level||1,coins=profile.coins||0,done=profile.completed_tasks||[],found=profile.discovered||[];document.getElementById('level').textContent='모험가 레벨 '+level;document.getElementById('slevel').textContent=level;document.getElementById('xp').textContent=xp+' XP';document.getElementById('coins').textContent=coins;document.getElementById('count').textContent=found.length+'/10';document.getElementById('tasklist').innerHTML=tasks.map(t=>`<div class="task"><span>${t}</span><button ${done.includes(t)?'disabled class="alt"':''} onclick="finishTask('${t}')">${done.includes(t)?'완료 ✓':'완료하기'}</button></div>`).join('');document.getElementById('booklist').innerHTML=creatures.map(([n,e,f])=>{let yes=found.includes(n);return `<div class="creature" onclick="details('${n}')"><div class="emoji ${yes?'':'hidden'}">${e}</div><b>${yes?n:'???'}</b><div class="small">${yes?f:'미발견'}</div></div>`}).join('')}
async function finishTask(t){let done=profile.completed_tasks||[];if(done.includes(t))return;let xp=(profile.xp||0)+20;await save({completed_tasks:[...done,t],xp,coins:(profile.coins||0)+10,level:Math.floor(xp/100)+1})}
function details(n){document.getElementById('detail').textContent=n+' · 진화 단계: 알 → 유아 → 성장기 → 성체';}
function showTab(t){document.getElementById('tasks').style.display=t==='tasks'?'block':'none';document.getElementById('book').style.display=t==='book'?'block':'none'}
async function logout(){await sb.auth.signOut();location.reload()}
window.addEventListener('load',()=>{let u=localStorage.getItem('wv_url'),k=localStorage.getItem('wv_key');if(u)document.getElementById('url').value=u;if(k)document.getElementById('key').value=k;if(u&&k){try{sb=window.supabase.createClient(u,k);sb.auth.getSession().then(({data})=>{if(data.session)enter().catch(e=>say(e.message))})}catch(e){}}});
</script></body></html>
