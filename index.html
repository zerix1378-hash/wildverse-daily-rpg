<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>WILDVERSE DAILY RPG</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#151d32;--line:#293653;--muted:#9aa8c3;--green:#9be15d;--blue:#65c7f7}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#1b2a45,#0b1020 55%);font-family:system-ui,sans-serif;color:#f4f7ff;min-height:100vh;padding:24px 16px}main{max-width:460px;margin:auto}.brand{text-align:center;margin:24px 0}.logo{font-size:42px}.brand h1{font-size:25px;letter-spacing:1px;margin:8px 0 4px}.brand p,.muted{color:var(--muted);font-size:13px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:0 18px 50px #0005}.tabs{display:flex;gap:8px;margin-bottom:20px}.tabs button{flex:1;border:1px solid var(--line);background:#10182b;color:#c8d3e8;border-radius:12px;padding:12px;font-weight:700}.tabs button.active{background:var(--green);color:#15210d;border-color:var(--green)}label{display:block;font-size:13px;color:#c8d3e8;margin:14px 0 7px}input{width:100%;padding:14px;border:1px solid var(--line);border-radius:12px;background:#0c1426;color:white;font-size:16px}.primary{width:100%;margin-top:18px;padding:14px;border:0;border-radius:12px;background:linear-gradient(90deg,#9be15d,#65c7f7);color:#0b1720;font-weight:800;font-size:16px}button:disabled{opacity:.55}.note{font-size:12px;line-height:1.6;color:var(--muted);margin-top:16px}.status{margin-top:14px;padding:12px;border-radius:10px;background:#0c1426;color:#c8d3e8;font-size:13px;line-height:1.5;display:none}#game{display:none}.welcome{font-size:20px;font-weight:800}.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:18px}.tile{background:#111a2d;border:1px solid var(--line);border-radius:13px;padding:13px 8px;text-align:center}.tile b{display:block;font-size:20px}.tile span{font-size:11px;color:var(--muted)}.logout{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:#10182b;color:#fff;font-weight:700;margin-top:14px}footer{text-align:center;color:#6f7e99;font-size:11px;margin:20px}
</style></head><body><main>
<header class="brand"><div class="logo">🌿</div><h1>WILDVERSE</h1><p>DAILY RPG · 나만의 생태계를 키워라</p></header>
<section class="panel" id="auth"><div class="tabs"><button id="loginTab" class="active" type="button">로그인</button><button id="joinTab" type="button">회원가입</button></div>
<form id="authForm"><label for="nickname">닉네임</label><input id="nickname" maxlength="16" autocomplete="username" placeholder="닉네임 입력 (2~16자)" required>
<label for="password">비밀번호</label><input id="password" type="password" minlength="6" autocomplete="current-password" placeholder="비밀번호 (6자 이상)" required>
<button class="primary" id="submitBtn" type="submit">로그인</button></form><div class="status" id="status" role="status"></div>
<p class="note">닉네임과 비밀번호로 가입·로그인합니다. 이메일은 입력하지 않습니다. 비밀번호는 Supabase 인증 시스템에서 관리되며 이 페이지에 저장되지 않습니다.</p></section>
<section class="panel" id="game"><p class="welcome" id="welcome"></p><p class="muted">WILDVERSE에 로그인했어! 계정 연결이 완료됐어.</p>
<div class="tiles"><div class="tile"><b>🥚</b><span>알에서 시작</span></div><div class="tile"><b>📖</b><span>생물 도감</span></div><div class="tile"><b>⚔️</b><span>온라인 모험</span></div></div>
<button class="logout" id="logoutBtn" type="button">로그아웃</button></section><footer>WILDVERSE DAILY RPG</footer></main>
<script>
const SUPABASE_URL='https://zvdaeauujohbatehqrko.supabase.co';
const SUPABASE_KEY='sb_publishable_DwsSTbg41K0JHYY1xSmgKw_9x1Re2zO';
const client=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);let mode='login',busy=false;
function message(s){$('status').textContent=s;$('status').style.display='block'}
function setMode(m){mode=m;$('loginTab').classList.toggle('active',m==='login');$('joinTab').classList.toggle('active',m==='join');$('submitBtn').textContent=m==='login'?'로그인':'회원가입';$('status').style.display='none'}
$('loginTab').onclick=()=>setMode('login');$('joinTab').onclick=()=>setMode('join');
async function internalEmail(n){const v=n.trim().normalize('NFKC').toLowerCase();const d=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v));const h=Array.from(new Uint8Array(d)).map(x=>x.toString(16).padStart(2,'0')).join('');return 'wv_'+h+'@login.wildverse.invalid'}
function showGame(n){$('auth').style.display='none';$('game').style.display='block';$('welcome').textContent='환영해, '+n+'!'}
async function saveProfile(user,n){const {error}=await client.from('profiles').upsert({id:user.id,nickname:n},{onConflict:'id'});if(error)throw error}
$('authForm').onsubmit=async e=>{e.preventDefault();if(busy)return;busy=true;$('submitBtn').disabled=true;$('status').style.display='none';const n=$('nickname').value.trim(),p=$('password').value;
try{if(n.length<2||n.length>16)throw Error('닉네임은 2~16자로 입력해 줘.');if(/[\\s@]/.test(n))throw Error('닉네임에는 공백이나 @를 사용할 수 없어.');if(p.length<6)throw Error('비밀번호는 6자 이상이어야 해.');const email=await internalEmail(n);
if(mode==='join'){const {data,error}=await client.auth.signUp({email,password:p,options:{data:{nickname:n}}});if(error)throw error;if(!data.session||!data.user)throw Error('가입은 접수됐지만 로그인 세션이 없어. Supabase의 Confirm email 설정을 꺼 줘.');await saveProfile(data.user,n);showGame(n)}
else{const {data,error}=await client.auth.signInWithPassword({email,password:p});if(error)throw error;const saved=data.user.user_metadata?.nickname||n;await saveProfile(data.user,saved);showGame(saved)}
}catch(err){message(err.message||'오류가 발생했어. 다시 시도해 줘.')}finally{busy=false;$('submitBtn').disabled=false}};
$('logoutBtn').onclick=async()=>{const {error}=await client.auth.signOut();if(error){message(error.message);return}$('game').style.display='none';$('auth').style.display='block';$('password').value='';setMode('login')};
(async()=>{const {data}=await client.auth.getSession();if(data.session)showGame(data.session.user.user_metadata?.nickname||'플레이어')})();
</script></body></html>
